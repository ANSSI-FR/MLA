[package]
name = "mla-oss-fuzz"
version = "0.1.0"
authors = ["ANSSI <opensource@ssi.gouv.fr>"]
edition = "2024"

[dependencies]
libfuzzer-sys = "0.4"
mla = { path = "../mla" }
mla-fuzz = { path = "../mla-fuzz" }

[[bin]]
name = "mla_fuzz"
path = "fuzz_targets/mla_fuzz.rs"

[package.metadata]
cargo-fuzz = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Custom profile for fuzzing - inherits from release but disables stripping.
# Stripping symbols breaks sanitizer detection (ASan), as the sanitizer
# runtime needs to access certain symbols.
#
# LTO MUST be disabled here: sancov-module coverage instrumentation (required
# for libFuzzer feedback) produces per-crate `__sancov_gen_*` symbols that
# become undefined references when LTO merges crates (cargo-fuzz#384).
# `lto = false` overrides the inherited `lto = true` from `release`.
#
# NOTE: This profile must also be defined in the workspace root Cargo.toml because:
# - When building as part of the workspace, cargo uses profiles from the root.
# - When building via "cargo build --manifest-path fuzz/Cargo.toml", cargo treats
#   this as a standalone package and needs the profile defined here.
# Defining it in both locations ensures compatibility with all build methods.
[profile.fuzzing]
inherits = "release"
strip = false
lto = false
