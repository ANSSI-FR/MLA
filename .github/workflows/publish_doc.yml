name: Deploy mdBook to GitHub Pages

permissions: {}

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-26.04
    container: rust@sha256:1f0dbad1df66647807e6952d1db85d0b2bda7606cb2139d82517e4f009967376 # v1.96.1 : pin to known-good previous stable release for increased stability and security
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mdbook
        run: cargo install mdbook mdbook-katex --locked

      - name: Install mdbook-katex
        run: cargo install --git https://github.com/lzanini/mdbook-katex --rev 5bb959bb61945e863f5b9d28425bb201d4054994 mdbook-katex --locked

      # GitHub Flavored Markdown's ```math blocks are not supported by GitHub Pages,
      # but KaTeX requires $$ math delimiters. This step converts ```math blocks to $$ blocks.
      - name: Preprocess markdown files - convert ```math blocks to $$ blocks
        run: |
          find ./doc/src -name '*.md' -exec sh -c '
            awk '\''
              /^```math$/ { in_math=1; print "$$"; next }
              /^```$/ && in_math { in_math=0; print "$$"; next }
              { print }
            '\'' "$1" > tmp && mv tmp "$1"
          ' sh {} \;

      - name: Build the book
        run: mdbook build ./doc

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./doc/book

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages # GitHub automatically uses this environment for Pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write  # Needed for gh-pages push
      id-token: write  # Needed for GitHub Pages deployment

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
