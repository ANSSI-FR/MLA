name: mla release

permissions: {}

on:
  push:
    tags:
      - "mla-v*"

env:
  GITHUB_REF: "${{ github.ref }}"

jobs:
  build:
    strategy:
      matrix:
        build: [linux-x86_64, windows-i686, windows-x86_64, windows-i686-debug, windows-x86_64-debug]
        include:
          - build: linux-x86_64
            os: ubuntu-latest
            container: rust@sha256:a8a5f0a1e5fe7dfe1d352591e4a1c7dd2c08fd70475cae872cf3458ba0df0546 # v1.98.1 : pin to known-good previous stable release for increased stability and security
            target: x86_64-unknown-linux-musl
            cargo_arg: --release
            path: |
              ./target/x86_64-unknown-linux-musl/release/libmla.a
          - build: windows-i686
            os: windows-latest
            container: null
            target: i686-pc-windows-msvc
            msvc_platform: Win32
            cargo_arg: --release
            path: |
              ./target/i686-pc-windows-msvc/release/mla.lib
              ./target/i686-pc-windows-msvc/release/mla.dll
              ./target/i686-pc-windows-msvc/release/mla.dll.lib
              ./target/i686-pc-windows-msvc/release/mla.pdb
          - build: windows-x86_64
            os: windows-latest
            container: null
            target: x86_64-pc-windows-msvc
            msvc_platform: x64
            cargo_arg: --release
            path: |
              ./target/x86_64-pc-windows-msvc/release/mla.lib
              ./target/x86_64-pc-windows-msvc/release/mla.dll
              ./target/x86_64-pc-windows-msvc/release/mla.dll.lib
              ./target/x86_64-pc-windows-msvc/release/mla.pdb
          - build: windows-i686-debug
            os: windows-latest
            container: null
            target: i686-pc-windows-msvc
            msvc_platform: Win32
            cargo_arg: ""
            path: |
              ./target/i686-pc-windows-msvc/debug/mla.lib
              ./target/i686-pc-windows-msvc/debug/mla.dll
              ./target/i686-pc-windows-msvc/debug/mla.dll.lib
              ./target/i686-pc-windows-msvc/debug/mla.pdb
          - build: windows-x86_64-debug
            os: windows-latest
            container: null
            target: x86_64-pc-windows-msvc
            msvc_platform: x64
            cargo_arg: ""
            path: |
              ./target/x86_64-pc-windows-msvc/debug/mla.lib
              ./target/x86_64-pc-windows-msvc/debug/mla.dll
              ./target/x86_64-pc-windows-msvc/debug/mla.dll.lib
              ./target/x86_64-pc-windows-msvc/debug/mla.pdb

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Rust toolchain (Windows)
      if: matrix.container == null
      run: rustup toolchain install 1.98.1
    - name: Set default toolchain (Windows)
      if: matrix.container == null
      run: rustup default 1.98.1
    - name: Add Rust target
      run: rustup target add ${{ matrix.target }}
    - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      if: matrix.msvc_platform
    - name: Build static library
      run: cargo build ${{ matrix.cargo_arg }} --manifest-path=bindings/C/Cargo.toml --target=${{ matrix.target }}
    - name: Generate SBOM
      if: matrix.build == 'linux-x86_64'
      run: |
        cargo install cargo-cyclonedx --locked --version 0.5.9
        export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
        cargo cyclonedx -f json --spec-version 1.5 --manifest-path mla/Cargo.toml --override-filename mla-sbom --target x86_64-unknown-linux-musl
        find . -name 'mla-sbom.json' ! -path './mla/*' -delete
    - name: Upload SBOM artifact
      if: matrix.build == 'linux-x86_64'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mla-sbom
        path: mla/mla-sbom.json
    - name: Upload resulting 'mla'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mla-${{ matrix.build }}
        path: ${{ matrix.path }}

  release:
    permissions: 
      # Used to generate artifact attestation
      attestations: write
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
    # From https://github.com/cloudflare/wrangler/blob/master/.github/workflows/release.yml
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Query version number
        id: get_version
        shell: bash
        run: |
          echo "using version tag ${GITHUB_REF:15}"
          echo "version=${GITHUB_REF:15}" >> $GITHUB_OUTPUT
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get Changelog Entry
        id: changelog_reader
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          path: ./mla/CHANGELOG.md
      - name: Create Release
        id: create_release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: mla-${{ steps.get_version.outputs.VERSION }}
          release_name: mla-${{ steps.get_version.outputs.VERSION }}
          body: |
            ${{ steps.changelog_reader.outputs.changes }}

            ## Verification of assets

            The assets are built from the `mla-v*` tag; the release name drops
            the leading `v` (historical naming).

            This release's assets are built by GitHub Runners and are attested using [SLSA provenance](https://slsa.dev/spec/v1.0/provenance) (https://docs.github.com/en/actions/concepts/security/artifact-attestations).

            The attestation is generated from the GitHub workflow that built the release artifacts, and is cryptographically signed and logged by GitHub and Sigstore. You can verify it using a GitHub account or directly with [cosign](https://github.com/sigstore/cosign), as described below:

            ### With a GitHub account
            You can run:

            ```bash
            gh attestation verify --repo ANSSI-FR/MLA <asset-path>
            ```

            where `<asset-path>` is the file path to the downloaded asset.

            ### Without a GitHub account
            You can do it directly with [cosign](https://github.com/sigstore/cosign). First, download the attestation from https://github.com/ANSSI-FR/MLA/attestations to `attestation.json` (and not the one in the release). Then run :

            ```bash
            cosign verify-blob-attestation \
              --bundle attestation.json \
              --type https://slsa.dev/provenance/v1 \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity https://github.com/ANSSI-FR/MLA/.github/workflows/mla_release.yml@refs/tags/mla-v${{ steps.get_version.outputs.VERSION }} \
              <asset-path>
            ```

            where `<asset-path>` is the file path to the downloaded asset.

            ### GPG signature of SHA256SUMS

            The `SHA256SUMS` file is signed with the release manager's GPG key
            (fingerprint announced in the release notes above, key published on
            [keys.openpgp.org](https://keys.openpgp.org)). The `SHA256SUMS.asc`
            signature is added manually to the draft before publication.

            ```bash
            gpg --keyserver keys.openpgp.org --recv-keys <fingerprint-above>
            gpg --verify SHA256SUMS.asc SHA256SUMS
            sha256sum -c SHA256SUMS
            ```

            On macOS, use `shasum -a 256 -c SHA256SUMS` instead of `sha256sum -c`.

          draft: true

      - name: Download linux-x86_64 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mla-linux-x86_64
          path: mla-linux-x86_64

      - name: Download windows-i686 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mla-windows-i686
          path: mla-windows-i686

      - name: Download windows-x86_64 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mla-windows-x86_64
          path: mla-windows-x86_64

      - name: Download windows-i686-debug artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mla-windows-i686-debug
          path: mla-windows-i686-debug

      - name: Download windows-x86_64-debug artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mla-windows-x86_64-debug
          path: mla-windows-x86_64-debug

      - name: Download SBOM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mla-sbom
          path: sbom

      - name: Release Linux artifact
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./mla-linux-x86_64/libmla.a
          asset_content_type: application/octet-stream
          asset_name: libmla-x86_64-static-${{ steps.get_version.outputs.VERSION }}.a

      - name: Zip Windows releases
        run: |
          zip --junk-paths windows-i686 mla-windows-i686/mla.dll mla-windows-i686/mla.lib mla-windows-i686/mla.dll.lib mla-windows-i686/mla.pdb
          zip --junk-paths windows-x86_64 mla-windows-x86_64/mla.dll mla-windows-x86_64/mla.lib mla-windows-x86_64/mla.dll.lib mla-windows-x86_64/mla.pdb
          zip --junk-paths windows-i686-debug mla-windows-i686-debug/mla.dll mla-windows-i686-debug/mla.lib mla-windows-i686-debug/mla.dll.lib mla-windows-i686-debug/mla.pdb
          zip --junk-paths windows-x86_64-debug mla-windows-x86_64-debug/mla.dll mla-windows-x86_64-debug/mla.lib mla-windows-x86_64-debug/mla.dll.lib mla-windows-x86_64-debug/mla.pdb

      - name: Release windows-i686
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./windows-i686.zip
          asset_content_type: application/zip
          asset_name: libmla-windows-i686-${{ steps.get_version.outputs.VERSION }}.zip

      - name: Release windows-x86_64
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./windows-x86_64.zip
          asset_content_type: application/zip
          asset_name: libmla-windows-x86_64-${{ steps.get_version.outputs.VERSION }}.zip

      - name: Release windows-i686-debug
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./windows-i686-debug.zip
          asset_content_type: application/zip
          asset_name: libmla-windows-i686-debug-${{ steps.get_version.outputs.VERSION }}.zip

      - name: Release windows-x86_64-debug
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./windows-x86_64-debug.zip
          asset_content_type: application/zip
          asset_name: libmla-windows-x86_64-debug-${{ steps.get_version.outputs.VERSION }}.zip

      - name: Release SBOM
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./sbom/mla-sbom.json
          asset_content_type: application/json
          asset_name: mla-${{ steps.get_version.outputs.VERSION }}-sbom.cdx.json

      # SHA256SUMS covers every asset above under its published name.
      # Before publishing the draft: gpg --armor --detach-sign -o
      # SHA256SUMS.asc SHA256SUMS, upload the .asc (assets are immutable
      # once published).
      - name: Generate SHA256SUMS
        run: |
          mkdir sha
          cp ./mla-linux-x86_64/libmla.a sha/libmla-x86_64-static-${{ steps.get_version.outputs.VERSION }}.a
          cp ./windows-i686.zip sha/libmla-windows-i686-${{ steps.get_version.outputs.VERSION }}.zip
          cp ./windows-x86_64.zip sha/libmla-windows-x86_64-${{ steps.get_version.outputs.VERSION }}.zip
          cp ./windows-i686-debug.zip sha/libmla-windows-i686-debug-${{ steps.get_version.outputs.VERSION }}.zip
          cp ./windows-x86_64-debug.zip sha/libmla-windows-x86_64-debug-${{ steps.get_version.outputs.VERSION }}.zip
          cp ./bindings/C/mla.h sha/mla.h
          cp ./bindings/C/mla.hpp sha/mla.hpp
          cp ./sbom/mla-sbom.json sha/mla-${{ steps.get_version.outputs.VERSION }}-sbom.cdx.json
          cd sha && sha256sum * > SHA256SUMS
      - name: Release SHA256SUMS
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./sha/SHA256SUMS
          asset_content_type: text/plain
          asset_name: SHA256SUMS

      - name: Attest artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ./mla-linux-x86_64/libmla.a
            ./windows-i686.zip
            ./windows-x86_64.zip
            ./windows-i686-debug.zip
            ./windows-x86_64-debug.zip
            ./bindings/C/mla.h
            ./bindings/C/mla.hpp
            ./sbom/mla-sbom.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release C Header file
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bindings/C/mla.h
          asset_content_type: application/octet-stream
          asset_name: mla.h

      - name: Release CPP Header file
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bindings/C/mla.hpp
          asset_content_type: application/octet-stream
          asset_name: mla.hpp

