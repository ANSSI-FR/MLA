name: mlar release

permissions: {}

on:
  push:
    tags:
      - "mlar-v*"

env:
  GITHUB_REF: "${{ github.ref }}"

jobs:
  build:
    strategy:
      matrix:
        build: [linux, macos, windows]
        include:
          - build: linux
            os: ubuntu-latest
            container: rust@sha256:a8a5f0a1e5fe7dfe1d352591e4a1c7dd2c08fd70475cae872cf3458ba0df0546 # v1.98.1 : pin to known-good previous stable release for increased stability and security
            target: x86_64-unknown-linux-musl
            cargo_build: --target x86_64-unknown-linux-musl
          - build: macos
            os: macos-latest
            container: null
          - build: windows
            os: windows-latest
            container: null
            extension: .exe

    runs-on: ${{matrix.os}}
    container: ${{matrix.container}}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Rust toolchain (macOS and Windows)
      if: matrix.container == null
      run: rustup toolchain install 1.98.1
    - name: Set default toolchain (macOS and Windows)
      if: matrix.container == null
      run: rustup default 1.98.1
    - name: Set target if any
      if: matrix.target
      run: rustup target add ${{ matrix.target }}
    - name: Build
      run: cargo build --release --all-features --package mlar --verbose ${{ matrix.cargo_build }}
    - name: Strip resulting binary
      if: matrix.build == 'linux'
      run: strip ./target/${{ matrix.target }}/release/mlar${{ matrix.extension }}
    - name: Generate SBOM
      if: matrix.build == 'linux'
      run: |
        cargo install cargo-cyclonedx --locked --version 0.5.9
        export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
        cargo cyclonedx -f json --spec-version 1.5 --manifest-path mlar/Cargo.toml --override-filename mlar-sbom --target x86_64-unknown-linux-musl
        find . -name 'mlar-sbom.json' ! -path './mlar/*' -delete
    - name: Upload SBOM artifact
      if: matrix.build == 'linux'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mlar-sbom
        path: mlar/mlar-sbom.json
    - name: Upload resulting 'mlar'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mlar-${{ matrix.build }}
        path: ./target/${{ matrix.target }}/release/mlar${{ matrix.extension }}

  release:
    permissions: 
      # Used to generate artifact attestation
      attestations: write
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
    # From https://github.com/cloudflare/wrangler/blob/master/.github/workflows/release.yml
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Query version number
        id: get_version
        shell: bash
        run: |
          echo "using version tag ${GITHUB_REF:15}"
          echo "version=${GITHUB_REF:15}" >> $GITHUB_OUTPUT
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get Changelog Entry
        id: changelog_reader
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          path: ./mlar/CHANGELOG.md
      - name: Create Release
        id: create_release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: mlar-${{ steps.get_version.outputs.VERSION }}
          release_name: mlar-${{ steps.get_version.outputs.VERSION }}
          body: |
            ${{ steps.changelog_reader.outputs.changes }}

            ## Verification of assets

            This release's assets are built by GitHub Runners and are attested using [SLSA provenance](https://slsa.dev/spec/v1.0/provenance) (https://docs.github.com/en/actions/concepts/security/artifact-attestations).

            The attestation is generated from the GitHub workflow that built the release artifacts, and is cryptographically signed and logged by GitHub and Sigstore. You can verify it using a GitHub account or directly with [cosign](https://github.com/sigstore/cosign), as described below:

            ### With a GitHub account
            You can run:

            ```bash
            gh attestation verify --repo ANSSI-FR/MLA <asset-path>
            ```

            where `<asset-path>` is the file path to the downloaded asset.

            ### Without a GitHub account
            You can do it directly with [cosign](https://github.com/sigstore/cosign). First, download the attestation from https://github.com/ANSSI-FR/MLA/attestations to `attestation.json` (and not the one in the release). Then run :

            ```bash
            cosign verify-blob-attestation \
              --bundle attestation.json \
              --type https://slsa.dev/provenance/v1 \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity https://github.com/ANSSI-FR/MLA/.github/workflows/mlar_release.yml@refs/tags/mlar-${{ steps.get_version.outputs.VERSION }} \
              <asset-path>
            ```

            where `<asset-path>` is the file path to the downloaded asset.

            ### GPG signature of SHA256SUMS

            The `SHA256SUMS` file is signed with the release manager's GPG key
            (fingerprint announced in the release notes above, key published on
            [keys.openpgp.org](https://keys.openpgp.org)). The `SHA256SUMS.asc`
            signature is added manually to the draft before publication.

            ```bash
            gpg --keyserver keys.openpgp.org --recv-keys <fingerprint-above>
            gpg --verify SHA256SUMS.asc SHA256SUMS
            sha256sum -c SHA256SUMS
            ```

            On macOS, use `shasum -a 256 -c SHA256SUMS` instead of `sha256sum -c`.

          draft: true

      - name: Download Linux artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mlar-linux
          path: mlar-linux

      - name: Download Windows artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mlar-windows
          path: mlar-windows

      - name: Download MacOS artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mlar-macos
          path: mlar-macos

      - name: Download SBOM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mlar-sbom
          path: sbom

      - name: Release Linux artifact
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./mlar-linux/mlar
          asset_content_type: application/octet-stream
          asset_name: mlar-linux-static-${{ steps.get_version.outputs.VERSION }}

      - name: Release Windows artifact
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./mlar-windows/mlar.exe
          asset_content_type: application/octet-stream
          asset_name: mlar-windows-${{ steps.get_version.outputs.VERSION }}.exe

      - name: Release MacOS artifact
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./mlar-macos/mlar
          asset_content_type: application/octet-stream
          asset_name: mlar-macos-${{ steps.get_version.outputs.VERSION }}

      - name: Release SBOM
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./sbom/mlar-sbom.json
          asset_content_type: application/json
          asset_name: mlar-${{ steps.get_version.outputs.VERSION }}-sbom.cdx.json

      # SHA256SUMS covers every asset above under its published name.
      # Before publishing the draft: gpg --armor --detach-sign -o
      # SHA256SUMS.asc SHA256SUMS, upload the .asc (assets are immutable
      # once published).
      - name: Generate SHA256SUMS
        run: |
          mkdir sha
          cp ./mlar-linux/mlar sha/mlar-linux-static-${{ steps.get_version.outputs.VERSION }}
          cp ./mlar-windows/mlar.exe sha/mlar-windows-${{ steps.get_version.outputs.VERSION }}.exe
          cp ./mlar-macos/mlar sha/mlar-macos-${{ steps.get_version.outputs.VERSION }}
          cp ./sbom/mlar-sbom.json sha/mlar-${{ steps.get_version.outputs.VERSION }}-sbom.cdx.json
          cd sha && sha256sum * > SHA256SUMS
      - name: Release SHA256SUMS
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./sha/SHA256SUMS
          asset_content_type: text/plain
          asset_name: SHA256SUMS

      - name: Attest artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ./mlar-linux/mlar
            ./mlar-windows/mlar.exe
            ./mlar-macos/mlar
            ./sbom/mlar-sbom.json
