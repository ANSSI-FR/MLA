# According to:
#  - https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#issue_comment
#  - https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/accessing-contextual-information-about-workflow-runs#github-context
#
name: Benchmark PR

permissions:
  contents: read
  pull-requests: write

on:
  issue_comment:
    types: [created]

jobs:
  runBenchmark:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/benchmark')
    name: Criterion benchmark
    runs-on: ubuntu-26.04

    steps:
      # The benchmark builds and runs the pull request's code, so only users with write access may start it.
      # author_association is not used: it describes how the author is associated with the repository, not their permission level.
      - name: Check that the commenter has write access
        run: |
          permission=$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq .permission)
          case "$permission" in
            admin|maintain|write) echo "$COMMENTER has $permission access" ;;
            *) echo "::error::/benchmark runs pull request code and needs write access; $COMMENTER has '$permission'"; exit 1 ;;
          esac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
      # issue_comment runs on the default branch, so without an explicit ref the "PR" column measured the default branch.
      - name: Checkout the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          persist-credentials: false
      - name: Get PR base branch name
        run: |
          branchName=$(curl -s https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.issue.number }} | python3 -c "import sys, json; print(json.load(sys.stdin)['base']['ref'])")
          echo "branchName=$branchName" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compares PR branch to target
        uses: boa-dev/criterion-compare-action@adfd3a94634fe2041ce5613eb7df09d247555b87 # v3.2.4
        with:
          branchName: ${{ env.branchName }}
          benchName: "bench_archive"
          token: ${{ secrets.GITHUB_TOKEN }}
