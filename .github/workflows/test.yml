name: Build & test

permissions: {}

on:
  push:
    branches: [ master ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        build: [linux, macos, windows]
        include:
          - build: linux
            os: ubuntu-latest
            container: rust@sha256:a8a5f0a1e5fe7dfe1d352591e4a1c7dd2c08fd70475cae872cf3458ba0df0546 # v1.98.1 : pin to known-good previous stable release for increased stability and security
          - build: macos
            os: macos-latest
            container: null
          - build: windows
            os: windows-latest
            container: null
            extension: .exe

    runs-on: ${{matrix.os}}
    container: ${{matrix.container}}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Build
      env:
        RUSTFLAGS: -D warnings
      run: cargo build --release --all --exclude mla-fuzz-afl --verbose
    - name: Run tests
      run: cargo test --all --exclude mla-fuzz-afl --release --verbose
    - name: Upload resulting 'mlar'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ matrix.build }}
        path: ./target/release/mlar${{ matrix.extension }}

  long-tests:
    runs-on: ubuntu-latest
    container: rust@sha256:a8a5f0a1e5fe7dfe1d352591e4a1c7dd2c08fd70475cae872cf3458ba0df0546 # v1.98.1 : pin to known-good previous stable release for increased stability and security

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Run long tests
      run: cd mla && cargo test --release -- --ignored

  all-features:
    runs-on: ubuntu-latest
    container: rust@sha256:a8a5f0a1e5fe7dfe1d352591e4a1c7dd2c08fd70475cae872cf3458ba0df0546 # v1.98.1 : pin to known-good previous stable release for increased stability and security

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Run long tests
      run: cargo test --all-features --all --exclude mla-fuzz-afl --exclude mla-bindings-c --release

  test-bindings-c-cpp-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Run C bindings tests on Linux
      working-directory: bindings/C/tests/linux-gcc-g++/
      run: make CC=gcc
    - name: Run C bindings tests on Linux
      working-directory: bindings/C/tests/linux-gcc-g++/
      run: make CC=g++

  test-bindings-c-cpp-windows:
    strategy:
      matrix:
        version: [Debug-c, Release-c, Debug-cpp, Release-cpp]
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
        include:
          - version: Debug-c
            cargo_arg: ""
          - version: Release-c
            cargo_arg: --release
          - version: Debug-cpp
            cargo_arg: ""
          - version: Release-cpp
            cargo_arg: --release
          - target: i686-pc-windows-msvc
            msvc_platform: Win32
          - target: x86_64-pc-windows-msvc
            msvc_platform: x64
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
    - name: Compile C/CPP bindings test program for Windows
      working-directory: bindings/C/tests/windows-msvc/
      run: msbuild mla-bindings-test.sln /p:Platform=${{ matrix.msvc_platform }} /p:Configuration=${{ matrix.version }}
    - name: Run C/CPP bindings test program on Windows
      working-directory: bindings/C/tests/windows-msvc/
      run: ./${{ matrix.msvc_platform }}/${{ matrix.version }}/mla-bindings-test.exe

  afl-build:
    runs-on: ubuntu-latest
    container: rust@sha256:a8a5f0a1e5fe7dfe1d352591e4a1c7dd2c08fd70475cae872cf3458ba0df0546 # v1.98.1 : pin to known-good previous stable release for increased stability and security

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: apt-get update && apt-get install -y llvm
      - name: Install cargo-afl binary crate
        run: cargo install cargo-afl --locked
      - name: Test AFL build
        env:
          RUSTFLAGS: -D warnings
        run: cargo afl build

  fmt:
    runs-on: ubuntu-latest
    container: rust@sha256:a8a5f0a1e5fe7dfe1d352591e4a1c7dd2c08fd70475cae872cf3458ba0df0546 # v1.98.1 : pin to known-good previous stable release for increased stability and security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Check format
        run: cargo fmt --all -- --check

  audit:
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    container: rust@sha256:a8a5f0a1e5fe7dfe1d352591e4a1c7dd2c08fd70475cae872cf3458ba0df0546 # v1.98.1 : pin to known-good previous stable release for increased stability and security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Security audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  clippy:
    runs-on: ubuntu-latest
    container: rust@sha256:a8a5f0a1e5fe7dfe1d352591e4a1c7dd2c08fd70475cae872cf3458ba0df0546 # v1.98.1 : pin to known-good previous stable release for increased stability and security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: apt-get update && apt-get install -y llvm
      - name: Install cargo-afl binary crate
        run: cargo install cargo-afl --locked
      - name: Install clippy
        run: rustup component add clippy
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  publish-dry-run:
      runs-on: ubuntu-latest
      container: rust@sha256:a8a5f0a1e5fe7dfe1d352591e4a1c7dd2c08fd70475cae872cf3458ba0df0546 # v1.98.1 : pin to known-good previous stable release for increased stability and security

      steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dry-run publish curve25519-parser
        run: cd curve25519-parser && cargo publish --dry-run --locked --registry crates-io
      - name: Dry-run publish mla
        run: cd mla && cargo publish --dry-run --locked --registry crates-io
      # curve25519-parser is a path dependency: its version check fails
      # under the root vendored source replacement, disable it here.
      # The tarball compiles against the mla version published on
      # crates.io: skip compilation.
      - name: Dry-run publish mlar
        run: |
          mv .cargo/config.toml .cargo/config.toml.vendored
          cd mlar
          rc=0
          cargo publish --dry-run --locked --registry crates-io --no-verify || rc=$?
          mv ../.cargo/config.toml.vendored ../.cargo/config.toml
          exit $rc
      
