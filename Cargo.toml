[workspace]
members = [
    "mla",
    "mla-fuzz-afl",
    "mla-fuzz",
    "mlar",
    "mlar/mlar-upgrader",
    "bindings/C",
    "fuzz",
]
resolver = "3"

[workspace.lints.clippy]
# all lints that are on by default (correctness, suspicious, style, complexity, perf)
all = {level = "deny", priority = -1}
arithmetic_side_effects = {level = "deny", priority = -1}
# lints which are rather strict or have occasional false positives
pedantic = {level = "deny", priority = -1}
# new lints that are still under development
# nursery = {level = "deny", priority = -1}
# lints which prevent the use of language and library features
# restriction = {level = "deny", priority = -1}
# lints for the cargo manifest
# cargo = {level = "deny", priority = -1}
# specific lints
cast_precision_loss = "allow"
fn_params_excessive_bools = "allow"
# for performance reasons, some functions need to be inlined
inline_always = "allow"
missing-errors-doc = "allow"
missing-panics-doc = "allow"
must_use_candidate = "allow"
# could be made stricter later for targets with small stacks
large_stack_arrays = "allow"
too-many-lines = "allow"
zero_sized_map_values = "allow"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[profile.release]
codegen-units = 1   # Use minimum codegen units for best size and runtime performances
opt-level = 3       # Optimize for maximum runtime performance
lto = true          # Enable Link Time Optimization
strip = true        # Removes symbols, reducing size

# Custom profile for fuzzing - inherits from release but disables stripping.
# Stripping symbols breaks sanitizer detection (ASan), as the sanitizer
# runtime needs to access certain symbols.
#
# LTO MUST be disabled here: sancov-module coverage instrumentation (required
# for libFuzzer feedback) produces per-crate `__sancov_gen_*` symbols that
# become undefined references when LTO merges crates (cargo-fuzz#384).
# `lto = false` overrides the inherited `lto = true` from `release`.
#
# NOTE: This profile must also be defined in fuzz/Cargo.toml because:
# - When building via "cargo build --manifest-path fuzz/Cargo.toml", cargo treats
#   fuzz/Cargo.toml as a standalone package and needs the profile defined there.
# - When building as part of the workspace, cargo uses profiles from the root.
# Defining it in both locations ensures compatibility with all build methods.
[profile.fuzzing]
inherits = "release"
strip = false
lto = false
